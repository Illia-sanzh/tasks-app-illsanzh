name: Check code
on: [push]
jobs:
  Run-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix: 
        path: [tasks-api, title-normalizer]
        python-ver: [3.12, 3.11]
    steps:
    - name: Install dependencies
      uses: actions/checkout@v6
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-ver }}
    - run: python -m pip install -r services/${{ matrix.path }}/requirements.txt
    - name: Run pytest
      run: set -o pipefail; pytest services/${{ matrix.path }} | tee ${{ matrix.path }}-test.txt
    - name: Archive the service test
      uses: actions/upload-artifact@v7
      with:
        name: ${{matrix.path}}-${{ matrix.python-ver }}-test-report
        path: ${{ matrix.path }}-test.txt
  Docker-compose:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v6
    - name: Start services
      run: docker compose -f services/compose.yaml up --build --detach --wait --wait-timeout 90
    - name: Wait for services
      run: |
        curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 http://localhost:5001/health >/dev/null
        curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 2 http://localhost:5000/health >/dev/null
    - name: Verify task normalization
      run: |
        post_response=$(curl --fail --silent --show-error -X POST http://localhost:5000/tasks \
          -H 'Content-Type: application/json' \
          -d '{"title": "  buy   milk "}')
        jq -e '. == {"id": 1, "normalized": true, "title": "Buy milk"}' <<< "$post_response"

        tasks_response=$(curl --fail --silent --show-error http://localhost:5000/tasks)
        jq -e '. == [{"id": 1, "normalized": true, "title": "Buy milk"}]' <<< "$tasks_response"
    - name: Stop services
      if: always()
      run: docker compose -f services/compose.yaml down


