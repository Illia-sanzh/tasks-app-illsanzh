name: Check code
on: [push]
jobs:
  Run-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix: 
        path: [tasks-api, title-normalizer]
        python-ver: [3.12, 3.11, 3.8]
    steps:
    - name: Install dependencies
      uses: actions/checkout@v6
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-ver }}
    - run:  python -m pip install -r services/${{ matrix.path }}/requirements.txt
    - name: Run pytest
      run:  pytest ${{ matrix.path }} | tee ${{ matrix.path }}-test.txt
    - name: Archive the service test
      uses: actions/upload-artifact@v7
      with:
        name: services-test-report
        path: ${{ matrix.path }}-test.txt



