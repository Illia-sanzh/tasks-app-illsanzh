name: Check code
on: [push]
jobs:
  Run-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix: 
        path: [services/tasks-api, services/title-normalizer]
    steps:
    - name: Install dependencies
      uses: actions/checkout@v6
    - run:  python -m pip install -r ${{ matrix.path }}/requirements.txt
    - name: Run pytest
      run:  pytest ${{ matrix.path }}


