version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: "pip"
    directory: ["/services/tasks-api", "/services/title-normalizer"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
  - package-ecosystem: "docker"
    directory: ["/services/tasks-api", "/services/title-normalizer"]
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      base-image:
        pattern: ["*"]
    ignore: 
      - dependency-name: "python"
        versions: ["3.12"]
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
